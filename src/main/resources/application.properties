spring.application.name=CryptoMind
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/cryptomind?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useUnicode=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:PaiSmart2025}
spring.data.redis.database=1

# DeepSeek
spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=${DEEPSEEK_API_MODEL:deepseek-chat}
# Elasticsearch
spring.elasticsearch.uris=http://${ES_HOST:localhost}:${ES_PORT:9200}
spring.elasticsearch.username=${ES_USERNAME:elastic}
spring.elasticsearch.password=${ES_PASSWORD:PaiSmart2025}

# Crypto
crypto.alert.check-interval=${ALERT_INTERVAL:300000}
crypto.supported-symbols=${SUPPORTED_SYMBOLS:BTCUSDT,ETHUSDT}

# Embedding?????????????
spring.ai.openai.embedding.api-key=${EMBEDDING_API_KEY}
spring.ai.openai.embedding.base-url=${EMBEDDING_API_URL}
spring.ai.openai.embedding.options.model=${EMBEDDING_API_MODEL}

# Binance
binance.api-key=${BINANCE_API_KEY:}
binance.secret-key=${BINANCE_SECRET_KEY:}

